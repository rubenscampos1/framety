<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="/">
    <title>Framety I Produtora especializada no mercado imobiliário.</title>
    <link rel="icon" type="image/png" href="/fav-icon2.png" sizes="any">
    <link rel="apple-touch-icon" href="/fav-icon2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <!-- Albert Sans é a tipografia do site. Vem do Google Fonts, e não da Adobe,
         porque o CSP do server.js já libera fonts.googleapis/gstatic — usar a
         Adobe Fonts exigiria abrir use.typekit.net no CSP e um kit próprio, para
         chegar na mesma família. Os pesos são os que o CSS usa: 300 a 800.
         A JetBrains Mono continua para as etiquetas técnicas (ver styles.css). -->
    <link
        href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- three.js serve ao fundo animado (wave-bg.js). unpkg é o único CDN que o
         CSP do server.js libera para script. Os dois com defer: a ordem é mantida. -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js" defer></script>
    <script src="wave-bg.js" defer></script>
    <script src="letter-swap.js" defer></script>
    <script src="content.js"></script>
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
</head>

<body>
    <!-- A animação de abertura já vem no HTML: aparece na hora, sem esperar o
         React. Quando o app monta, o mesmo preloader do React toma o lugar. -->
    <div id="root"><div class="preloader-overlay"><dotlottie-player
        src="https://lottie.host/7b021c4f-c07b-4fa7-a871-4f97765a15b7/R1VsSDksQ4.lottie"
        background="transparent" speed="1.5" style="width:600px;height:600px" autoplay loop transparent></dotlottie-player></div></div>

    <script src="api.js"></script>
    <script src="rotas.js"></script>
    <script src="live.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <!-- Os .jsx chegam já compilados pelo servidor (/<nome>.jsx.js): sem Babel no navegador. -->
    <!-- html2canvas + jsPDF are loaded on demand (only when exporting an OS PDF) — see loadPdfLibs() in admin.jsx -->

    <script src="tweaks-panel.jsx.js" defer></script>
    <script src="data.jsx.js" defer></script>
    <script src="primitives.jsx.js" defer></script>
    <script src="landing.jsx.js" defer></script>
    <script src="category.jsx.js" defer></script>
    <script src="os-doc.jsx.js" defer></script>
    <script src="admin.jsx.js" defer></script>
    <script src="presentation.jsx.js" defer></script>
    <script src="partner.jsx.js" defer></script>
    <script src="tutorial.jsx.js" defer></script>
    <script src="novidades.jsx.js" defer></script>
    <script src="minigame.jsx.js" defer></script>
    <script src="instafone.jsx.js" defer></script>
    <script src="storyboard.jsx.js" defer></script>
    <script src="screendimension.jsx.js" defer></script>
    <script src="app.jsx.js" defer></script>
</body>

</html>
